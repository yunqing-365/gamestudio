<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Master v4.0 - Python 工业流水线中枢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .checkerboard {
            background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), 
                              linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #f1f5f9 75%), 
                              linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
            background-size: 12px 12px; background-color: #ffffff;
        }
        #addModuleModal, #assetPickerModal { transition: opacity 0.2s, visibility 0.2s; }
        #addModuleModal.hidden, #assetPickerModal.hidden { opacity: 0; visibility: hidden; pointer-events: none; display: flex !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex font-sans antialiased">

    <aside class="w-[280px] bg-white border-r border-slate-200 flex flex-col shadow-xl z-20 flex-shrink-0 relative">
        <div class="p-8 border-b border-slate-100">
            <div class="w-14 h-14 bg-gradient-to-tr from-slate-900 to-slate-700 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-4">🎛️</div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Asset Hub</h1>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">v4.0 Python Backend API</p>
        </div>

        <div class="flex-1 p-6 space-y-6 overflow-y-auto scrollbar-hide">
            
            <div>
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4 px-2">资产仓库 Repository</p>
                <div class="space-y-2">
                    <button onclick="openWorkspace('asset', 'ALL')" id="nav-ALL" class="nav-btn w-full flex items-center justify-between px-4 py-3 rounded-xl bg-slate-900 text-white shadow-md transition-all">
                        <span class="font-bold text-sm flex items-center gap-3">🗂️ 全部资产</span>
                        <span id="count-ALL" class="bg-white/20 px-2 py-0.5 rounded-md text-[10px] font-mono">0</span>
                    </button>
                    <button onclick="openWorkspace('asset', 'UNPROCESSED')" id="nav-UNPROCESSED" class="nav-btn w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition-all">
                        <span class="font-bold text-sm flex items-center gap-3">🧊 待处理区</span>
                        <span id="count-UNPROCESSED" class="bg-slate-200 px-2 py-0.5 rounded-md text-[10px] font-mono">0</span>
                    </button>
                    <button onclick="openWorkspace('asset', 'PROCESSED')" id="nav-PROCESSED" class="nav-btn w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition-all">
                        <span class="font-bold text-sm flex items-center gap-3">🔥 成品仓库</span>
                        <span id="count-PROCESSED" class="bg-slate-200 px-2 py-0.5 rounded-md text-[10px] font-mono">0</span>
                    </button>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-4 px-2">
                    <p class="text-[11px] font-black text-blue-600 uppercase tracking-widest">工业流水线 Pipeline</p>
                    <button onclick="toggleModal(true)" class="w-6 h-6 bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white rounded-md flex items-center justify-center font-bold transition-colors" title="添加新模块">+</button>
                </div>
                <div id="toolModuleList" class="space-y-2">
                    </div>
            </div>
        </div>

        <div id="importContainer" class="p-6 border-t border-slate-100 bg-slate-50 transition-all">
            <button onclick="document.getElementById('fileInput').click()" class="w-full py-4 bg-slate-800 text-white text-sm font-black uppercase rounded-2xl shadow-xl hover:bg-slate-700 transition active:scale-95 tracking-widest flex items-center justify-center gap-2">
                <span>➕ 上传素材至服务器</span>
            </button>
            <input type="file" id="fileInput" class="hidden" multiple accept="image/*">
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative overflow-hidden bg-slate-100">
        
        <header class="h-20 glass-panel border-b border-slate-200/60 px-8 flex items-center justify-between z-10 sticky top-0 flex-shrink-0">
            <div>
                <h2 id="viewTitle" class="text-lg font-black text-slate-800">🗂️ 全部资产 (All Assets)</h2>
                <p id="viewSubtitle" class="text-xs text-slate-500 font-medium mt-0.5">与 Python 服务器同步中...</p>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="relative" id="searchContainer">
                    <input type="text" placeholder="检索素材名称..." class="px-5 py-2.5 bg-white border border-slate-200 rounded-full text-sm w-64 focus:outline-none focus:ring-4 ring-blue-50 focus:border-blue-400 transition-all shadow-sm">
                </div>
                
                <button id="btnInjectAsset" onclick="openAssetPicker()" class="hidden px-6 py-2.5 bg-indigo-600 text-white rounded-full text-xs font-black tracking-widest uppercase shadow-lg shadow-indigo-200 hover:bg-indigo-500 transition-all active:scale-95 flex items-center gap-2 border-2 border-indigo-400/50">
                    <span>📥</span> 从「待处理区」调取素材
                </button>
            </div>
        </header>

        <div id="assetWorkspace" class="flex-1 overflow-y-auto p-8 scrollbar-hide">
            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center opacity-60">
                <div class="text-6xl mb-4">📭</div>
                <h3 class="text-lg font-black text-slate-700 mb-2">服务器数据库为空</h3>
                <p class="text-sm text-slate-500 max-w-sm">点击左下角按钮上传图片，它们将被物理保存到 /assets/raw 文件夹中。</p>
            </div>
            <div id="assetGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-6 hidden">
                </div>
        </div>

        <iframe id="toolWorkspace" class="flex-1 w-full h-full hidden border-none bg-white" src=""></iframe>
    </main>

    <div id="addModuleModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-white w-96 rounded-[2.5rem] p-8 shadow-2xl transform scale-100 transition-transform">
            <h3 class="text-xl font-black text-slate-800 mb-6">➕ 挂载新模块</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">图标 (Emoji)</label>
                    <input type="text" id="modIcon" placeholder="✂️" value="✂️" class="mt-1 w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">模块名称</label>
                    <input type="text" id="modName" placeholder="例如: 智能切解器" class="mt-1 w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">目标 HTML 文件路径</label>
                    <input type="text" id="modUrl" placeholder="例如: 切解器.html" class="mt-1 w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 font-mono text-sm">
                </div>
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="toggleModal(false)" class="flex-1 py-3 text-slate-500 hover:bg-slate-50 font-bold rounded-xl transition">取消</button>
                <button onclick="saveNewModule()" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition">保存模块</button>
            </div>
        </div>
    </div>

    <div id="assetPickerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-8">
        <div class="bg-white w-full max-w-4xl max-h-full rounded-[2.5rem] flex flex-col shadow-2xl overflow-hidden transform scale-100 transition-transform">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-black text-slate-800 flex items-center gap-3">
                    <span class="text-2xl">🧊</span> 选择素材并注入工具
                </h3>
                <button onclick="toggleAssetPicker(false)" class="w-8 h-8 bg-slate-200 text-slate-600 rounded-full font-bold hover:bg-slate-300 transition">✕</button>
            </div>
            
            <div class="p-6 flex-1 overflow-y-auto bg-slate-100/50">
                <div id="pickerEmptyState" class="hidden flex flex-col items-center justify-center py-16 opacity-50">
                    <span class="text-6xl mb-4">📭</span>
                    <p class="font-bold text-slate-600">待处理区空空如也</p>
                    <p class="text-xs mt-2">请先在「资产仓库」中上传素材。</p>
                </div>
                <div id="pickerGrid" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // =====================================
        // 数据库与状态
        // =====================================
        let assetDb = []; 
        let currentFilter = 'ALL';
        
        let toolModules = JSON.parse(localStorage.getItem('assetHubModules')) || [
            { id: 'tool_1', icon: '🔪', name: 'Slicer Pro 切图', url: '/static/切解器.html' },
            { id: 'tool_2', icon: '✨', name: 'FX Forge 光影', url: '/static/光影引擎.html' },
            { id: 'tool_3', icon: '🌌', name: 'Particle 粒子室', url: '/static/粒子与光影.html' },
            { id: 'tool_4', icon: '🌊', name: '全景无缝修复', url: '/static/自动修复.html' }
        ];

        // DOM 元素引用
        const fileInput = document.getElementById('fileInput');
        const assetGrid = document.getElementById('assetGrid');
        const emptyState = document.getElementById('emptyState');
        const toolModuleList = document.getElementById('toolModuleList');
        
        const assetWorkspace = document.getElementById('assetWorkspace');
        const toolWorkspace = document.getElementById('toolWorkspace');
        const importContainer = document.getElementById('importContainer');
        const searchContainer = document.getElementById('searchContainer');
        const btnInjectAsset = document.getElementById('btnInjectAsset');
        
        const viewTitle = document.getElementById('viewTitle');
        const viewSubtitle = document.getElementById('viewSubtitle');

        // =====================================
        // 核心一：工作区路由系统
        // =====================================
        function openWorkspace(type, payload) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'shadow-md', 'bg-indigo-50', 'text-indigo-700');
                btn.classList.add('text-slate-600', 'hover:bg-slate-50');
            });

            if (type === 'asset') {
                currentFilter = payload;
                const activeBtn = document.getElementById(`nav-${payload}`);
                if(activeBtn) {
                    activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-50');
                    activeBtn.classList.add('bg-slate-900', 'text-white', 'shadow-md');
                }

                assetWorkspace.classList.remove('hidden');
                toolWorkspace.classList.add('hidden');
                importContainer.style.display = 'block';
                searchContainer.style.display = 'block';
                btnInjectAsset.classList.add('hidden');

                const titles = {
                    'ALL': '🗂️ 全部资产 (All Assets)',
                    'UNPROCESSED': '🧊 待处理区 (Unprocessed Queue)',
                    'PROCESSED': '🔥 成品仓库 (Processed Repository)'
                };
                viewTitle.innerText = titles[payload];
                viewSubtitle.innerText = "数据已同步至 Python 本地服务器";

                renderAssetEngine();
            } 
            else if (type === 'tool') {
                const module = toolModules.find(m => m.id === payload);
                if(!module) return;

                const activeBtn = document.getElementById(`nav-${payload}`);
                if(activeBtn) {
                    activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-50');
                    activeBtn.classList.add('bg-indigo-50', 'text-indigo-700', 'shadow-sm'); 
                }

                assetWorkspace.classList.add('hidden');
                toolWorkspace.classList.remove('hidden');
                importContainer.style.display = 'none'; 
                searchContainer.style.display = 'none';
                btnInjectAsset.classList.remove('hidden');

                viewTitle.innerText = `${module.icon} ${module.name}`;
                viewSubtitle.innerText = `沙盒引擎运行中: ${module.url}`;
                
                if (toolWorkspace.src !== module.url || toolWorkspace.src === "") {
                    toolWorkspace.src = module.url;
                }
            }
        }

        // =====================================
        // 核心二：跨帧素材注入引擎
        // =====================================
      // =====================================
        // 核心二：跨帧素材注入引擎
        // =====================================
        function toggleAssetPicker(show) {
            document.getElementById('assetPickerModal').classList.toggle('hidden', !show);
        }

        // 🌟 1. 【这是全新加在这里的】监听子模块发回的处理结果
        window.addEventListener('message', async (e) => {
            if (e.data && e.data.action === 'export_asset') {
                viewSubtitle.innerText = "⏳ 接收到流水线回传数据，正在入库暂存区...";
                try {
                    const response = await fetch('/api/pipeline_save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: e.data.filename, base64: e.data.base64 })
                    });
                    if (response.ok) {
                        const newAsset = await response.json();
                        assetDb.push(newAsset);
                        viewSubtitle.innerText = "✅ 已自动保存在「暂存区」！";
                        // 自动切换到暂存区查看
                        if (currentFilter !== 'INTERMEDIATE') openWorkspace('asset', 'INTERMEDIATE');
                        else renderAssetEngine();
                    }
                } catch (err) {
                    console.error("入库失败", err);
                }
            }
        });

        // 🌟 2. 【替换原来的函数】改造注图逻辑：不再查 DOM，直接利用总线广播
        async function injectAssetIntoTool(asset) {
            const iframeWin = document.getElementById('toolWorkspace').contentWindow;
            // 通过通信协议发送
            iframeWin.postMessage({
                action: 'inject_asset',
                asset: { name: asset.name, url: asset.url }
            }, '*');
            
            toggleAssetPicker(false);
            viewSubtitle.innerText = `✅ 素材已推送至目标工具的接收器！`;
        }

        // 🌟 3. 【替换原来的函数】让注入选择器显示所有图片（包括刚生成的暂存图）
        function openAssetPicker() {
            // 将所有状态的文件混合，并倒序排列（最新的排前面）
            const allAssets = [...assetDb].reverse(); 
            const pickerGrid = document.getElementById('pickerGrid');
            pickerGrid.innerHTML = '';
            
            allAssets.forEach(asset => {
                const card = document.createElement('div');
                // 根据状态给点颜色区分
                const badgeColor = asset.status === 'INTERMEDIATE' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500';
                card.className = "bg-white p-3 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-indigo-500 hover:shadow-lg transition-all group relative active:scale-95";
                card.onclick = () => injectAssetIntoTool(asset);
                card.innerHTML = `
                    <div class="checkerboard w-full aspect-square rounded-xl overflow-hidden mb-3 relative border border-slate-100">
                        <img src="${asset.url}" class="w-full h-full object-contain pixelated p-2">
                        <div class="absolute inset-0 bg-indigo-900/0 group-hover:bg-indigo-900/40 transition-colors flex items-center justify-center backdrop-blur-[0px] group-hover:backdrop-blur-[2px]">
                            <span class="bg-indigo-600 text-white text-[11px] font-black uppercase tracking-widest px-4 py-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity shadow-2xl scale-90 group-hover:scale-100">注入此图</span>
                        </div>
                    </div>
                    <p class="text-[10px] font-bold text-slate-700 truncate px-1 text-center" title="${asset.name}">${asset.name}</p>
                    <div class="absolute top-1 left-1 px-2 py-0.5 rounded text-[8px] font-black ${badgeColor}">${asset.status}</div>
                `;
                pickerGrid.appendChild(card);
            });
            toggleAssetPicker(true);
        }
        

       
        // =====================================
        // 工具模块管理
        // =====================================
        function renderToolModules() {
            toolModuleList.innerHTML = '';
            toolModules.forEach(mod => {
                const btn = document.createElement('button');
                btn.id = `nav-${mod.id}`;
                btn.className = "nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition-all font-bold text-sm relative group";
                btn.innerHTML = `
                    <span>${mod.icon}</span> 
                    <span class="flex-1 text-left truncate">${mod.name}</span>
                    <span onclick="deleteModule(event, '${mod.id}')" class="absolute right-4 text-red-400 opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-600">🗑️</span>
                `;
                btn.onclick = () => openWorkspace('tool', mod.id);
                toolModuleList.appendChild(btn);
            });
            localStorage.setItem('assetHubModules', JSON.stringify(toolModules));
        }

        function toggleModal(show) {
            const modal = document.getElementById('addModuleModal');
            if (show) { modal.classList.remove('hidden'); document.getElementById('modName').value = ''; document.getElementById('modUrl').value = ''; } 
            else { modal.classList.add('hidden'); }
        }

        function saveNewModule() {
            const icon = document.getElementById('modIcon').value || '🔧';
            const name = document.getElementById('modName').value;
            const url = document.getElementById('modUrl').value;
            if(!name || !url) return alert("请填写模块名称和路径！");
            toolModules.push({ id: 'tool_' + Date.now(), icon: icon, name: name, url: url });
            renderToolModules(); toggleModal(false);
        }

        function deleteModule(event, id) {
            event.stopPropagation();
            if(confirm("确定要移除该模块吗？")) {
                toolModules = toolModules.filter(m => m.id !== id);
                renderToolModules(); openWorkspace('asset', 'ALL');
            }
        }


        // =====================================
        // 🚀 核心三：接入 Python 后端的真实流水线
        // =====================================
        
        // 1. 初始化拉取数据库数据
        async function loadAssetsFromServer() {
            try {
                const response = await fetch('/api/assets');
                if (response.ok) {
                    assetDb = await response.json();
                    renderAssetEngine();
                }
            } catch (e) {
                console.error("⚠️ 无法连接到 Python 后端", e);
                viewSubtitle.innerText = "⚠️ 无法连接到后台服务器，请确保已运行 uvicorn";
            }
        }

        // 2. 真实物理上传 (存储到硬盘)
        fileInput.onchange = async (e) => {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            if (files.length === 0) return;
            
            viewSubtitle.innerText = "⏳ 正在上传并写入本地服务器硬盘...";

            for (let file of files) {
                const formData = new FormData();
                formData.append("file", file);

                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    if (response.ok) {
                        const newAsset = await response.json();
                        assetDb.push(newAsset);
                    }
                } catch (err) {
                    console.error("上传失败", err);
                }
            }
            fileInput.value = ""; 
            viewSubtitle.innerText = "✅ 上传成功并已持久化";
            renderAssetEngine();
        };

        // 3. 呼叫 OpenCV 后端处理
        async function toggleStatus(id) {
            const asset = assetDb.find(a => a.id === id);
            if (!asset) return;

            if (asset.status === 'UNPROCESSED') {
                viewSubtitle.innerText = "🤖 OpenCV 视觉引擎处理中...";
                try {
                    const response = await fetch(`/api/process/${id}`, { method: 'POST' });
                    if (response.ok) {
                        const result = await response.json();
                        asset.status = result.asset.status;
                        asset.url = result.asset.url; // 替换为处理后的新图 URL
                        viewSubtitle.innerText = "✨ OpenCV 后台处理完成！已写入硬盘。";
                    }
                } catch (err) {
                    console.error("处理失败", err);
                    viewSubtitle.innerText = "❌ OpenCV 处理异常";
                }
            } else {
                // 仅状态切换
                asset.status = 'UNPROCESSED';
            }
            renderAssetEngine();
        }

        // 4. 渲染图库 UI
        function renderAssetEngine() {
            const filteredAssets = currentFilter === 'ALL' ? assetDb : assetDb.filter(a => a.status === currentFilter);
            document.getElementById('count-ALL').innerText = assetDb.length;
            document.getElementById('count-UNPROCESSED').innerText = assetDb.filter(a => a.status === 'UNPROCESSED').length;
            document.getElementById('count-PROCESSED').innerText = assetDb.filter(a => a.status === 'PROCESSED').length;

            if (filteredAssets.length === 0) {
                emptyState.classList.remove('hidden'); assetGrid.classList.add('hidden'); assetGrid.innerHTML = ''; return;
            }

            emptyState.classList.add('hidden'); assetGrid.classList.remove('hidden'); assetGrid.innerHTML = '';

            filteredAssets.forEach(asset => {
                const isProcessed = asset.status === 'PROCESSED';
                const card = document.createElement('div');
                card.className = "group bg-white rounded-[2rem] p-3 border border-slate-200 shadow-sm hover:shadow-xl transition-all flex flex-col cursor-default hover:-translate-y-1 relative overflow-hidden";
                card.innerHTML = `
                    <div class="checkerboard w-full aspect-square rounded-[1.5rem] border border-slate-100 overflow-hidden relative">
                        <img src="${asset.url}" class="w-full h-full object-contain pixelated p-2">
                        <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
                            <button onclick="toggleStatus('${asset.id}')" class="px-5 py-2.5 ${isProcessed ? 'bg-slate-700 hover:bg-slate-600' : 'bg-blue-600 hover:bg-blue-500'} text-white text-[11px] font-black uppercase rounded-full shadow-lg transition-transform active:scale-95">
                                ${isProcessed ? '撤回状态' : '使用 OpenCV 自动处理'}
                            </button>
                        </div>
                        <div class="absolute top-3 left-3 px-2.5 py-1 rounded-md text-[9px] font-black uppercase shadow-sm ${isProcessed ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-slate-800 text-white'}">
                            ${isProcessed ? '✓ OpenCV PROCESSED' : 'RAW ASSET'}
                        </div>
                    </div>
                    <div class="px-2 pt-4 pb-2">
                        <h4 class="text-xs font-bold text-slate-800 truncate" title="${asset.name}">${asset.name}</h4>
                        <div class="flex justify-between items-center mt-1">
                            <p class="text-[10px] text-slate-400 font-mono">${asset.id}</p>
                        </div>
                    </div>
                `;
                assetGrid.appendChild(card);
            });
        }

        // --- 系统初始化 ---
        renderToolModules();
        openWorkspace('asset', 'ALL'); 
        
        // 🌟 启动时立刻请求服务器同步数据
        loadAssetsFromServer();
        
// 🎮 Pipeline SDK (放入所有子模块中)
window.PipelineSDK = {
    init(customHandler) {
        window.addEventListener('message', async (e) => {
            if (e.data && e.data.action === 'inject_asset') {
                const res = await fetch(e.data.asset.url);
                const blob = await res.blob();
                const file = new File([blob], e.data.asset.name, { type: blob.type });
                
                if (customHandler) {
                    // 工具自定义了接收逻辑（如有多槽位）
                    customHandler(file);
                } else {
                    // 默认行为：寻找页面中第一个 fileInput 强行塞入
                    const input = document.getElementById('fileInput') || document.querySelector('input[type="file"]');
                    if(input) {
                        const dt = new DataTransfer(); dt.items.add(file);
                        input.files = dt.files;
                        input.dispatchEvent(new Event('change', {bubbles:true}));
                    }
                }
            }
        });
    },
    push(canvas, filename) {
        // 将画布结果打回父窗口
        window.parent.postMessage({
            action: 'export_asset', filename: filename, base64: canvas.toDataURL('image/png')
        }, '*');
        
        // 显示流水线通知 Toast
        const div = document.createElement('div');
        div.innerHTML = '🚀 已推送至流水线暂存区';
        div.className = 'fixed top-4 right-4 bg-emerald-500 text-white px-4 py-2 rounded-xl shadow-2xl z-50 font-black tracking-widest text-xs uppercase animate-pulse';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2500);
    }
};
    </script>
</body>
